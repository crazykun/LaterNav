{{ define "partials/friend-links.html" }}
{{ if .friendLinks }}
<section aria-labelledby="friend-links-title" class="mt-12">
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm p-5 sm:p-6">
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-700 dark:to-gray-700 flex items-center justify-center shrink-0 border border-blue-100 dark:border-gray-600">
                    <svg class="w-4 h-4 text-blue-500 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 010 5.656l-3 3a4 4 0 01-5.656-5.656l1.5-1.5m8.084-8.084l1.5-1.5a4 4 0 015.656 5.656l-3 3a4 4 0 01-5.656 0"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.172 13.828a4 4 0 010-5.656l3-3a4 4 0 015.656 5.656l-1.5 1.5m-8.084 8.084l-1.5 1.5a4 4 0 01-5.656-5.656l3-3a4 4 0 015.656 0"></path>
                    </svg>
                </div>
                <div>
                    <h2 id="friend-links-title" class="text-base sm:text-lg font-bold text-gray-900 dark:text-white leading-tight">友情链接</h2>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">发现更多值得收藏的网站</p>
                </div>
            </div>
            <span class="text-xs text-gray-400 dark:text-gray-500 bg-gray-50 dark:bg-gray-700 px-2.5 py-1 rounded-full">合作伙伴</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
            {{ range .friendLinks }}
            <a href="{{ .URL }}" target="_blank" rel="noopener noreferrer"
               class="group flex items-center gap-3 p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-700/30 hover:bg-white dark:hover:bg-gray-700 hover:border-blue-300 dark:hover:border-blue-500 hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 min-w-0">
                <span class="relative shrink-0">
                    {{ if .Logo }}
                    <img src="{{ .Logo }}" alt="{{ .Name }}" loading="lazy" referrerpolicy="no-referrer"
                         class="w-10 h-10 rounded-lg object-contain border border-gray-100 dark:border-gray-600 bg-white dark:bg-gray-800 shadow-sm"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    <span class="w-10 h-10 rounded-lg shrink-0 hidden items-center justify-center text-white font-bold text-sm shadow-sm" style="background-color: {{ .Color }}">{{ .Initials }}</span>
                    {{ else }}
                    <span class="w-10 h-10 rounded-lg shrink-0 flex items-center justify-center text-white font-bold text-sm shadow-sm" style="background-color: {{ .Color }}">{{ .Initials }}</span>
                    {{ end }}
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-sm font-medium text-gray-900 dark:text-white truncate group-hover:text-blue-500 dark:group-hover:text-blue-400 transition-colors">{{ .Name }}</span>
                    {{ if .Description }}
                    <span class="block text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5">{{ .Description }}</span>
                    {{ end }}
                </span>
                <svg class="w-3.5 h-3.5 text-gray-300 dark:text-gray-600 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 group-hover:text-blue-400 transition-all duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
{{ end }}
