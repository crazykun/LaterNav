{{ define "partials/password-form.html" }}
{{ if .success }}<p role="status" class="mb-3 rounded-lg bg-green-50 dark:bg-green-900/20 p-3 text-sm text-green-700 dark:text-green-300">{{ .success }}。请刷新页面以更新绑定状态。</p>{{ end }}
{{ if .initialCredentials }}
<form hx-post="/api/auth/set-initial-credentials" hx-target="#password-form" hx-swap="innerHTML" class="space-y-3">
    {{ if .error }}<div class="text-red-600 text-sm">{{ .error }}</div>{{ end }}
    <p class="text-sm text-gray-600 dark:text-gray-400">这是首次设置本站登录名和密码，请勿使用公开的默认密码。</p>
    <label for="initial_new_password" class="block text-sm text-gray-700 dark:text-gray-200">新密码</label>
    <input id="initial_new_password" type="password" name="new_password" autocomplete="new-password" required minlength="6" placeholder="至少 6 位" class="w-full px-3 py-2 text-sm border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600">
    <label for="initial_confirm_password" class="block text-sm text-gray-700 dark:text-gray-200">确认新密码</label>
    <input id="initial_confirm_password" type="password" name="confirm_password" autocomplete="new-password" required minlength="6" class="w-full px-3 py-2 text-sm border rounded-lg dark:bg-gray-700 dark:text-white dark:border-gray-600">
    <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">
    <button type="submit" class="w-full min-h-11 bg-blue-600 hover:bg-blue-700 text-white text-sm py-2.5 rounded-lg cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">设置本站凭据</button>
</form>
{{ else }}
<form hx-post="/api/auth/change-password" hx-target="#password-form" hx-swap="innerHTML" class="space-y-3">
    <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">
    {{ if .error }}
    <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 px-3 py-2.5 rounded-lg text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{ .error }}
    </div>
    {{ end }}


    <div>
        <label for="current_password" class="block text-sm text-gray-600 dark:text-gray-400 mb-1">当前密码</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required
               class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
    </div>

    <div>
        <label for="new_password" class="block text-sm text-gray-600 dark:text-gray-400 mb-1">新密码</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="6"
               placeholder="至少6位"
               class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
    </div>

    <div>
        <label for="confirm_password" class="block text-sm text-gray-600 dark:text-gray-400 mb-1">确认新密码</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="6"
               placeholder="再次输入新密码"
               class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
    </div>

    <button type="submit" class="w-full min-h-11 bg-blue-600 text-white text-sm py-2.5 rounded-lg hover:bg-blue-700 transition-colors font-medium cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">
        修改密码
    </button>
</form>
{{ end }}
{{ end }}
