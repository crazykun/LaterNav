<!DOCTYPE html>
<html lang="zh-CN">
<head><title>{{ .formTitle }} - {{ .SiteName }}</title>{{ template "admin-head" . }}</head>
<body class="admin-body">
<div class="admin-shell">
    {{ template "admin-sidebar" . }}
    <div class="admin-main">
        {{ template "admin-topbar" . }}
        <main class="admin-content">
            <section class="admin-surface admin-form-surface max-w-3xl">
                {{ template "admin-flash" . }}
                <form action="{{ .formAction }}" method="POST" class="admin-form-grid">
                    <input type="hidden" name="csrf_token" value="{{ .csrfToken }}">
                    <div>
                        <label for="name" class="admin-label">站点名称</label>
                        <input type="text" id="name" name="Name" value="{{ with .item }}{{ .Name }}{{ end }}" class="admin-input" maxlength="100" required>
                    </div>
                    <div>
                        <label for="url" class="admin-label">站点URL</label>
                        <input type="text" id="url" name="URL" value="{{ with .item }}{{ .URL }}{{ end }}" class="admin-input" maxlength="512" placeholder="https://example.com" required>
                    </div>
                    <div>
                        <label for="description" class="admin-label">站点描述</label>
                        <textarea id="description" name="Description" rows="2" class="admin-textarea" maxlength="255" placeholder="选填，首页友链卡片显示一行">{{ with .item }}{{ .Description }}{{ end }}</textarea>
                    </div>
                    {{ template "admin-logo-field" . }}
                    <div>
                        <label for="sort_order" class="admin-label">排序值（小的在前）</label>
                        <input type="number" id="sort_order" name="SortOrder" value="{{ with .item }}{{ .SortOrder }}{{ end }}" class="admin-input" min="0">
                    </div>
                    <div class="admin-checkbox-row">
                        <input type="checkbox" id="enabled" name="Enabled" {{ with .item }}{{ if .Enabled }}checked{{ end }}{{ end }} class="admin-checkbox">
                        <label for="enabled" class="admin-checkbox-label">启用（显示在首页）</label>
                    </div>
                    <div class="admin-form-actions">
                        <a href="/admin/friend-links" class="admin-btn-secondary">取消</a>
                        <button type="submit" class="admin-btn-primary">保存</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
</body>
</html>
